name: Build and upload to PyPI

on:
  push:
  release:
    types:
      - published

jobs:
  build_sdist:
    name: "Build source distribution"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Install uv"
        uses: astral-sh/setup-uv@v5

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: "Build sdist"
        run: uv build --sdist --out-dir dist

      - name: "Rename sdist package"
        run: mv ${{ github.workspace }}/dist/deepgraph-*.tar.gz ${{ github.workspace }}/dist/deepgraph.tar.gz

      - name: "Display structure of sdist files"
        run: |
          ls
          ls -R dist

      - name: "Upload artifact"
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/deepgraph.tar.gz
          if-no-files-found: error

  build_wheels:
    needs: build_sdist
    name: "Build wheels on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-13, macos-latest]

    steps:
      - name: "Download artifact"
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: "Display structure of downloaded files"
        run: |
          ls
          ls -R dist

      - name: "Install uv"
        uses: astral-sh/setup-uv@v5

      - name: "Build wheels"
        uses: pypa/cibuildwheel@v2.23.2
        with:
          package-dir: dist/deepgraph.tar.gz

      - name: "Display structure of wheelhouse folder"
        run: ls -R wheelhouse

      - name: "Upload artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  upload_pypi:
    needs: [build_wheels, build_sdist]
    name: "Upload release to PyPI"
    runs-on: ubuntu-latest
    environment:
      name: pypi
      # url: https://pypi.org/p/deepgraph
    permissions:
      id-token: write
    if: github.event_name == 'push'
    # if: github.event_name == 'release' && github.event.action == 'published'
    # or, alternatively, upload to PyPI on every tag starting with 'v' (remove on: release above to use this)
    # if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: "Download sdist"
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: "Extract version from pyproject.toml"
        id: extract_version
        run: |
          version=$(grep -Po '(?<=version = ")[^"]*' pyproject.toml)
          echo "version=$version" >> $GITHUB_ENV

      - name: "Rename sdist package with version"
        run: mv dist/deepgraph.tar.gz dist/deepgraph-${{ env.version }}.tar.gz

      - name: "Download wheels"
        uses: actions/download-artifact@v4  # see here: https://github.com/actions/upload-artifact/issues/480
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: "Display files in dist/ folder"
        run: |
          ls
          ls -R dist/

      - name: "Publish package distributions to TestPyPI"
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

#      - name: "Publish package distributions to PyPI"
#        uses: pypa/gh-action-pypi-publish@release/v1
