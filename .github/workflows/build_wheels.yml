name: Build and upload to PyPI

on:
  push:
  release:
    types:
      - published

jobs:
  build_sdist:
    name: "Build source distribution"
    runs-on: ubuntu-latest

    steps:
      - name: "checkout"
        uses: actions/checkout@v4

      - name: "Install uv"
        uses: astral-sh/setup-uv@v5

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: "Build sdist"
        run: uv build --sdist --out-dir dist

      - name: "Rename sdist package"
        run: mv ${{ github.workspace }}/dist/deepgraph-*.tar.gz ${{ github.workspace }}/dist/deepgraph.tar.gz

      - name: "Display structure of sdist files"
        run: |
          ls
          ls -R dist

      - name: "upload artifact"
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/deepgraph.tar.gz
          if-no-files-found: error

  build_wheels:
    needs: build_sdist
    name: "Build wheels on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-13, macos-latest]

    steps:
      - name: "download artifact"
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: "Display structure of downloaded files"
        run: |
          ls
          ls -R dist

      - name: "Install uv"
        uses: astral-sh/setup-uv@v5

      - name: "Build wheels"
        uses: pypa/cibuildwheel@v2.23.2
        with:
          package-dir: dist/deepgraph.tar.gz

      - name: "Display structure of dist folder"
        run: ls -R dist

      - name: "upload artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: ./wheelhouse/*.whl

